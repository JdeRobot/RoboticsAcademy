[pytest]
DJANGO_SETTINGS_MODULE = academy.test_settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    django: Django model and view tests
    hal: HAL interface tests
    gui: GUI interface tests
    console: Console interface tests
