{% load static %}
{% load render_bundle from webpack_loader %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="{% static 'public/logo.ico' %}" />
    <link rel="apple-touch-icon" href="{% static 'public/logo.ico' %}" />
    <link rel="manifest" href="{% static 'public/manifest.json' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv='cache-control' content='no-cache'>
    <meta http-equiv='expires' content='0'>
    <meta
      name="description"
      content="Web site for Robotics programming"
    />
    <!-- Roboto Typography -->
    <link
      href="https://fonts.googleapis.com/css?family=Roboto"
      rel="stylesheet"
    />
    <title>RoboticsAcademy</title>
    {% render_bundle 'main' 'css' %}
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>

{% block before_end_body %}
    {% render_bundle 'main' 'js' %}
{% endblock %}
