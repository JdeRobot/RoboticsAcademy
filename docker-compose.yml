services:
  my-postgres:
    image: jderobot/robotics-database
    container_name: my-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user-dev
      POSTGRES_PASSWORD: robotics-academy-dev
      POSTGRES_DB: academy_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user-dev -d academy_db"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - robotics_pgdata:/var/lib/postgresql

  developer-container:
    image: jderobot/robotics-academy:latest
    container_name: developer-container
    restart: unless-stopped
    privileged: true
    depends_on:
      my-postgres:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DISPLAY: ":0"
    ports:
      - "7163:7163"
      - "7164:7164"
      - "8000:8000"

volumes:
  robotics_pgdata:
