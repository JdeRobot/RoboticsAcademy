# Runs the arm64 RoboticsBackend on an x86 host through QEMU emulation
# Register the emulator first (lost on every reboot)
#   docker run --privileged --rm tonistiigi/binfmt --install arm64
services:
  my-postgres:
    image: postgres:18
    container_name: world_db_arm
    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: user-dev
      POSTGRES_PASSWORD: robotics-academy-dev
    volumes:
      - ../RoboticsInfrastructure/database/worlds.sql:/docker-entrypoint-initdb.d/1.sql:ro
      - ../database/exercises/db.sql:/docker-entrypoint-initdb.d/2.sql:ro
      - ../database/django_auth.sql:/docker-entrypoint-initdb.d/3.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U user-dev -d academy_db
      interval: 3s
      timeout: 1s
      retries: 20

  robotics-academy:
    image: jderobot/robotics-academy:arm-test-arm64
    platform: linux/arm64
    container_name: developer-container-arm
    command: "-s"
    ports:
      - "7164:7164"
      - "7163:7163"
      - "6080-6090:6080-6090"
    tty: true
    stdin_open: true
    depends_on:
      my-postgres:
        condition: service_healthy
