# Generates and uploads an image of Robotics-Academy using the desired tag and branches
name: Generate tagged RoboticsAcademy image

on:
  workflow_call:
    inputs:
      tag:
        description: 'Docker Image Tag'
        required: true
        default: test
        type: string
      latest:
        description: 'Upload as latest'
        required: true
        default: false
        type: boolean
      RA:
        description: 'Branch of RoboticsAcademy'
        required: true
        default: humble-devel
        type: string
      RI:
        description: 'Branch of Robotics Infrastructure'
        required: true
        default: humble-devel
        type: string
      RAM:
        description: 'Branch of Robotics Application Manager'
        required: true
        default: humble-devel
        type: string
      ROS:
        description: 'ROS Distro (humble)'
        required: true
        default: humble
        type: string
      academy_owner:
        description: 'GitHub owner for RoboticsAcademy'
        required: false
        default: JdeRobot
        type: string
      infra_owner:
        description: 'GitHub owner for RoboticsInfrastructure'
        required: false
        default: JdeRobot
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker Image Tag'
        required: true
        default: test
        type: string
      latest:
        description: 'Upload as latest'
        required: true
        default: false
        type: boolean
      RA:
        description: 'Branch of RoboticsAcademy'
        required: true
        default: humble-devel
        type: string
      RI:
        description: 'Branch of Robotics Infrastructure'
        required: true
        default: humble-devel
        type: string
      RAM:
        description: 'Branch of Robotics Application Manager'
        required: true
        default: humble-devel
        type: string
      ROS:
        description: 'ROS Distro (humble)'
        required: true
        default: humble
        type: string
      academy_owner:
        description: 'GitHub owner for RoboticsAcademy'
        required: false
        default: JdeRobot
        type: string
      infra_owner:
        description: 'GitHub owner for RoboticsInfrastructure'
        required: false
        default: JdeRobot
        type: string

jobs:
  push_to_registry:
    name: Run Test and Update Docker Image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Save the version tag
        run: echo "TAG=${TAG#v}" >> $GITHUB_ENV
      - run: echo ${TAG}
      - name: Check out the repo # checking our the code at current commit that triggers the workflow
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch-webserver-id }}
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build base image
        run: |
          sudo apt-get update
          cd scripts/RADI
          if [ "${{ github.event.inputs.ROS }}" == "humble" ]; then
            docker build --build-arg TARGETARCH=amd64 -f Dockerfile.dependencies_humble -t jderobot/robotics-applications:dependencies-humble .
          else
            echo "Incorrect ROS version"
          fi
      - name: Build and push RADI
        run: |
          cd scripts/RADI
          if [ "${{ github.event.inputs.ROS }}" == "humble" ]; then
            docker build --no-cache -f Dockerfile.humble \
              --build-arg ROBOTICS_ACADEMY=${{ github.event.inputs.RA }}\
              --build-arg ROBOTICS_INFRASTRUCTURE=${{ github.event.inputs.RI }} \
              --build-arg RAM=${{ github.event.inputs.RAM }} \
              --build-arg ROS_DISTRO=${{ github.event.inputs.ROS }} \
              --build-arg IMAGE_TAG=${TAG} \
              --build-arg ACADEMY_OWNER=${{ github.event.inputs.academy_owner }} \
              --build-arg INFRA_OWNER=${{ github.event.inputs.infra_owner }} \
              -t jderobot/robotics-academy:${TAG} .
            docker push jderobot/robotics-academy:${TAG}
          else
            echo "Incorrect ROS version"
          fi
      - name: Upload as Latest
        if:  ${{ inputs.latest }} 
        run: |
            docker image tag jderobot/robotics-academy:${TAG} jderobot/robotics-academy:latest
            docker push jderobot/robotics-academy:latest